<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Features Section</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }

    .features {
      padding: 4rem 2rem;
      text-align: center;
      background: white;
    }

    .features h2 {
      font-size: 2rem;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .features-container {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .feature-card {
      background: #f4f4f4;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .feature-card h3 {
      margin-bottom: 1rem;
      font-size: 1.3rem;
      color: #4caf50;
    }

    .feature-card p {
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <section class="features">
    <h2>Our Features</h2>
    <div class="features-container">
      <div class="feature-card">
        <h3>🏃 Speed</h3>
        <p>Our event is designed to challenge your limits and push you forward faster.</p>
      </div>
      <div class="feature-card">
        <h3>⛰️ Adventure</h3>
        <p>Experience breathtaking mountain trails with stunning views all along.</p>
      </div>
      <div class="feature-card">
        <h3>🤝 Community</h3>
        <p>Run alongside people who share your passion for fitness and the outdoors.</p>
      </div>
    </div>
  </section>

</body>
</html>
