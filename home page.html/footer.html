<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Example</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    footer {
      background: #333;       /* dark background */
      color: white;           /* white text */
      text-align: center;     /* center the content */
      padding: 2rem 1rem;     /* space inside */
      margin-top: 2rem;       /* space above footer */
    }

    footer a {
      color: #4caf50;         /* green links */
      text-decoration: none;
      margin: 0 1rem;
    }

    footer a:hover {
      text-decoration: underline;
    }

    footer p {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #bbb;            /* lighter gray for small text */
    }
  </style>
</head>
<body>

  <!-- Page content -->
  <div style="padding: 3rem; text-align:center;">
    <h1>Welcome to Mountain Run</h1>
    <p>Adventure awaits. Scroll down to see the footer.</p>
  </div>

  <!-- Footer -->
  <footer>
    <nav>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">Privacy Policy</a>
    </nav>
    <p>&copy; 2025 Mountain Run. All rights reserved.</p>
  </footer>

</body>
</html>
