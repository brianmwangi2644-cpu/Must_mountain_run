<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUST Mountain Run — Race History</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: #f0f8f7;
      color: #333;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #2e8b57, #00bcd4);
      color: white;
      text-align: center;
      padding: 2rem 1rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* History Grid */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 3rem 1rem;
      justify-items: center;
    }

    .race-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      overflow: hidden;
      width: 250px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .race-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .race-card h3 {
      padding: 0.8rem 0;
      background: #00bcd4;
      color: white;
      font-size: 1.2rem;
    }

    .race-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }
    </style>


  <!-- HEADER -->
  <header>
    <h1>MUST Mountain Run — Past Races</h1>
    <p>Visual history of our events</p>
  </header>

 

  <!-- HISTORY GRID -->
  <section class="history-grid">
    <div class="race-card">
      <img src="images/race2024.jpg" alt="Race 2024">
      <h3>2024</h3>
    </div>
    <div class="race-card">
      <img src="images/race2023.jpg" alt="Race 2023">
      <h3>2023</h3>
    </div>
    <div class="race-card">
      <img src="images/race2022.jpg" alt="Race 2022">
      <h3>2022</h3>
    </div>
    <div class="race-card">
      <img src="/home/engineer/Desktop/mountain run docs and 4tos/y.jpg" alt="Race 2021">
      <h3>2021</h3>
    </div>
  </section>

</body>
</html>
